# Calendar42 como un solo servicio: la API de Express sirve también el
# frontend compilado. Ciclo de vida en el Makefile (make start | stop | logs | build).
services:
  calendar42:
    build: .
    image: calendar42:local
    container_name: calendar42
    # Credenciales de la app OAuth de la intra (FT_CLIENT_ID, FT_CLIENT_SECRET).
    # Sin .env arranca igualmente, en modo demo.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Zona horaria del servidor: los datos de ejemplo del demo se generan en
      # hora local (los de la intra traen la suya y no dependen de esto).
      TZ: ${TZ:-Europe/Madrid}
      SESSIONS_FILE: /data/sessions.json
      # URL pública con la que se abre la app: a ella vuelve el login de la
      # intra, así que <PUBLIC_URL>/api/auth/callback debe estar registrada
      # como redirect URI en la app OAuth. Se puede fijar en .env.
      APP_URL: ${PUBLIC_URL:-http://localhost:${PUBLIC_PORT:-3000}}
      FT_REDIRECT_URI: ${PUBLIC_URL:-http://localhost:${PUBLIC_PORT:-3000}}/api/auth/callback
    ports:
      - "${PUBLIC_PORT:-3000}:3000"
    volumes:
      # Sesiones persistentes entre reinicios del contenedor.
      - calendar42-data:/data
    restart: unless-stopped

volumes:
  calendar42-data:
